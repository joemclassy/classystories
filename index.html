<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClassyStories">
<meta name="theme-color" content="#0E1018">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ClassyStories Story Player</title>
<style>
:root{--ui:#14161F;--ui2:#1D2030;--ui3:#2A2E42;--line:#363B55;--tx:#ECEEF6;--tx2:#A7ADC6;--acc:#FFC93C;--bad:#FF6B6B;--ok:#5BD69A;--warn:#FFB347}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E1018;color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
#stageWrap{position:fixed;inset:0}
#stage{width:100%;height:100%;display:block}
body.laser #stageWrap{cursor:none}
#laser{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ff4d4d 30%,#e00000 62%,rgba(255,0,0,0) 72%);box-shadow:0 0 18px 8px rgba(255,30,30,.55);pointer-events:none;z-index:50;display:none;transition:transform .08s}
body.laser #laser.on{display:block}
#laser.down{transform:scale(1.6)}
#hud{position:fixed;left:10px;top:10px;z-index:40;background:rgba(14,16,24,.82);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--tx2);display:flex;gap:12px;align-items:center;user-select:none}
#hud b{color:var(--tx)}
#hud .rec{color:var(--bad)}
#hud .k{background:var(--ui3);border-radius:5px;padding:1px 6px;color:var(--tx);font-size:12px;cursor:pointer}
body.record #hud,body.record #hint{display:none}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:rgba(14,16,24,.82);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--tx2)}
#toast{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-end}
#toast div{background:var(--ui2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:9px 14px;font-size:14px;max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
/* svg character + scene animation */
.eyeB{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.upper{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.walking .legL{animation:stepA .46s ease-in-out infinite}
.walking .legR{animation:stepB .46s ease-in-out infinite}
.walking .upper{animation:bob .23s ease-in-out infinite alternate}
@keyframes stepA{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes stepB{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.mouthT{display:none}
.talking .mouthN{display:none}
.talking .mouthT{display:inline;animation:talk .17s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.waving .R .elA{animation:wv .55s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-24deg)}to{transform:rotate(22deg)}}
.drift{animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
.blinkw{animation:winb 7s steps(1) infinite}
@keyframes winb{0%,70%{opacity:1}71%,100%{opacity:.15}}
.twinkle{animation:tw 2.8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.passR{animation:passR 17s linear infinite}
@keyframes passR{from{transform:translateX(-1400px)}to{transform:translateX(7000px)}}
.passL{animation:passL 21s linear infinite}
@keyframes passL{from{transform:translateX(7200px)}to{transform:translateX(-1400px)}}
.spin{animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{animation:spin 60s steps(60) infinite}
.slowspin{animation:spin 12s linear infinite}
.sway{animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.flick{animation:flick 3.3s steps(1) infinite}
@keyframes flick{0%,40%{opacity:1}41%,44%{opacity:.55}45%,100%{opacity:1}}
.float{animation:float 2.6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.steam{animation:steam 2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.drip{animation:drip 1.4s ease-in infinite}
@keyframes drip{0%{opacity:.95;transform:translateY(0)}100%{opacity:.1;transform:translateY(10px)}}
.flap{animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.4)}}
.fly{animation:fly 26s linear infinite}
@keyframes fly{from{transform:translateX(-900px)}to{transform:translateX(1900px)}}
.kenburns{animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
#cam{transition:transform .8s cubic-bezier(.3,.7,.3,1)}
#cam.instant{transition:none}
.bub{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-weight:700;color:#1C1C1E;line-height:1.18;text-align:center;display:inline-block;word-wrap:break-word;overflow-wrap:anywhere}
/* v1.1 activities */
.act-hammer .shA.R{animation:hammer .64s ease-in infinite}
@keyframes hammer{0%{transform:rotate(-8deg)}55%{transform:rotate(-26deg)}76%{transform:rotate(82deg)}100%{transform:rotate(-8deg)}}
.puk{opacity:0}
.act-hammer .puk{animation:puk .64s infinite}
@keyframes puk{0%,72%{opacity:0;transform:scale(.5)}78%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.act-sweep .shA.R{animation:sweepA .8s ease-in-out infinite alternate}
@keyframes sweepA{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.act-cook .shA.R .elA{animation:stir 1.1s ease-in-out infinite}
@keyframes stir{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.act-type .shA.R .elA,.act-text .shA.R .elA,.act-write .shA.R .elA{animation:typeA .2s ease-in-out infinite alternate}
.act-type .shA.L .elA,.act-text .shA.L .elA{animation:typeA .2s ease-in-out infinite alternate-reverse}
@keyframes typeA{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.act-count .shA.R .elA{animation:flick .45s ease-in-out infinite}
@keyframes flick{0%,100%{transform:rotate(0)}40%{transform:rotate(-22deg)}}
.act-eat .shA.R .elA{animation:eatA 1.5s ease-in-out infinite}
@keyframes eatA{0%,35%{transform:rotate(0)}55%,85%{transform:rotate(38deg)}100%{transform:rotate(0)}}
.act-eat .mouthN{display:none}.act-eat .mouthT{display:inline;animation:talk .28s ease-in-out infinite alternate}
.act-drink .shA.R .elA{animation:drinkA 2.2s ease-in-out infinite}
@keyframes drinkA{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.act-drink .mouthN{display:none}
.act-water .drops{animation:drip .7s ease-in infinite}
.act-weep .torsoA{animation:sob .42s ease-in-out infinite}
@keyframes sob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.act-laughhard .torsoA{animation:lol .3s ease-in-out infinite alternate}
@keyframes lol{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-5px) rotate(1.5deg)}}
.act-sleep .headA{transform:rotate(13deg)}
.act-carry .torsoA{animation:carryA .9s ease-in-out infinite alternate}
@keyframes carryA{from{transform:translateY(0)}to{transform:translateY(3px)}}
.act-hug .shA.R .elA{animation:hugA 1.2s ease-in-out infinite alternate}.act-hug .shA.L .elA{animation:hugB 1.2s ease-in-out infinite alternate}
@keyframes hugA{from{transform:rotate(0)}to{transform:rotate(8deg)}}@keyframes hugB{from{transform:rotate(0)}to{transform:rotate(-8deg)}}
.running .shA.R{animation:swingA .28s ease-in-out infinite alternate}.running .shA.L{animation:swingA .28s ease-in-out infinite alternate-reverse}
@keyframes swingA{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
.running .legL,.running .legR{animation-duration:.28s}
.walking .legC{animation:bob .3s ease-in-out infinite alternate}
.spinZ{animation:spin 1.6s linear infinite}
/* v1.2 dances + sports */
.act-samba .torsoA{animation:samba .5s ease-in-out infinite}
@keyframes samba{0%,100%{transform:translateX(-7px) rotate(-5deg)}50%{transform:translateX(7px) rotate(5deg)}}
.act-samba .legL{animation:stepA .5s ease-in-out infinite}.act-samba .legR{animation:stepB .5s ease-in-out infinite}
.act-samba .shA.R{animation:sambaArm .5s ease-in-out infinite alternate}.act-samba .shA.L{animation:sambaArmL .5s ease-in-out infinite alternate}
@keyframes sambaArm{from{transform:rotate(-34deg)}to{transform:rotate(46deg)}}@keyframes sambaArmL{from{transform:rotate(-46deg)}to{transform:rotate(34deg)}}
.act-samba .jumpA{animation:sambaB .25s ease-in-out infinite alternate}
@keyframes sambaB{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.act-budots .torsoA{animation:budots .28s ease-in-out infinite alternate}
@keyframes budots{from{transform:translateY(0)}to{transform:translateY(12px)}}
.act-budots .shA.R{animation:flapA .28s ease-in-out infinite alternate}.act-budots .shA.L{animation:flapB .28s ease-in-out infinite alternate}
@keyframes flapA{from{transform:rotate(-22deg)}to{transform:rotate(26deg)}}@keyframes flapB{from{transform:rotate(22deg)}to{transform:rotate(-26deg)}}
.act-budots .legL{animation:stepA .56s ease-in-out infinite}.act-budots .legR{animation:stepB .56s ease-in-out infinite}
.act-dribble .shA.R .elA{animation:drib .36s ease-in-out infinite alternate}
@keyframes drib{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.bball{animation:bounceB .36s ease-in infinite alternate}
@keyframes bounceB{from{transform:translateY(0)}to{transform:translateY(64px)}}
.tvs{animation:tvs 2.4s steps(1) infinite}
@keyframes tvs{0%{fill:#5B8FD6}25%{fill:#E57BA1}50%{fill:#5BD69A}75%{fill:#F6C453}}
.bass{animation:bass .45s ease-in-out infinite alternate}
@keyframes bass{from{transform:scale(1)}to{transform:scale(1.12)}}
.sirenR{animation:sirenA .5s steps(1) infinite}.sirenB{animation:sirenA .5s steps(1) infinite reverse}
@keyframes sirenA{0%,49%{opacity:1}50%,100%{opacity:.15}}
.wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.bob{animation:bobA 2.4s ease-in-out infinite alternate}
@keyframes bobA{from{transform:translateY(-6px) rotate(-1.5deg)}to{transform:translateY(6px) rotate(1.5deg)}}
.fog{animation:fogA 22s ease-in-out infinite alternate}
@keyframes fogA{from{transform:translateX(-300px)}to{transform:translateX(300px)}}
.flame{animation:flameA .18s ease-in-out infinite alternate}
@keyframes flameA{from{transform:scaleY(1)}to{transform:scaleY(.8)}}
.discoR{animation:spin 5s linear infinite}
.wag{animation:wag .35s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.ghostF{animation:ghostF 2.6s ease-in-out infinite alternate}
@keyframes ghostF{from{transform:translateY(-14px)}to{transform:translateY(14px)}}
.ghostO{animation:ghostO 3.4s ease-in-out infinite alternate}
@keyframes ghostO{from{opacity:.62}to{opacity:.95}}
.act-countmoney .shA.R .elA{animation:flick .5s ease-in-out infinite}
.act-countmoney .flickB{animation:flick .5s ease-in-out infinite;transform-origin:0 0}
.dreamEdge{animation:dreamE 3.5s ease-in-out infinite alternate}
@keyframes dreamE{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
/* ---------- mobile ---------- */
#mbar{display:none}
body.mobile #hud,body.mobile #hint,body.mobile #laser{display:none!important}
body.mobile #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(14,16,24,.92);border-top:1px solid var(--line);justify-content:space-between;align-items:center}
#mbar button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--ui3);color:var(--tx);font-size:15px;font-weight:600;padding:0 4px;-webkit-tap-highlight-color:transparent}
#mbar button.pri{background:var(--acc);color:#1C1C1E;border-color:var(--acc)}
#mtop{display:none}
body.mobile #mtop{display:block;position:fixed;left:0;right:0;top:0;z-index:44;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:linear-gradient(rgba(14,16,24,.85),rgba(14,16,24,0));font-size:13px;color:var(--tx2);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mobile.record #mbar,body.mobile.record #mtop{display:none}
body.mobile #toast{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));align-items:stretch}
body.mobile #toast div{max-width:none}
#holdHint{display:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:46;background:rgba(14,16,24,.9);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--tx);font-size:15px;text-align:center}
.wp{display:inline-block;animation:wpop .38s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes wpop{from{transform:translateY(26px) scale(.55);opacity:0}to{transform:none;opacity:1}}
/* studio */
#studio{position:fixed;inset:0;z-index:70;background:rgba(10,12,20,.94);display:none;flex-direction:column}
#studio.open{display:flex}
.sbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--ui);flex-wrap:wrap}
.sbar .ttl{font-weight:700;letter-spacing:1px;color:var(--acc);margin-right:10px}
.tab{background:none;border:none;color:var(--tx2);padding:7px 12px;border-radius:7px;cursor:pointer}
.tab.on{background:var(--ui3);color:var(--tx)}
.btn{background:var(--ui3);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#5A6188}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1C1C1E;font-weight:700}
.btn.dng{border-color:#7A3B3B;color:#FFB0B0}
.sp{flex:1}
.pane{display:none;flex:1;min-height:0}
.pane.on{display:flex}
#paneStory{gap:0}
#editorCol{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#txt{flex:1;resize:none;background:#0B0D14;border:none;outline:none;padding:14px 16px;font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:14px;line-height:1.55;color:#DDE2F2;tab-size:2;white-space:pre;overflow:auto}
#edStatus{padding:6px 14px;font-size:12px;color:var(--tx2);border-top:1px solid var(--line);background:var(--ui)}
#sideCol{width:400px;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;background:var(--ui)}
.card{background:var(--ui2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.card h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);font-weight:600}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
.row label{font-size:12px;color:var(--tx2);min-width:58px}
.in{background:#0B0D14;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px;min-width:0}
select.in{padding:4px 5px}
.issues{max-height:190px;overflow:auto;font-size:12.5px}
.iss{padding:4px 6px;border-radius:5px;cursor:pointer;margin:2px 0;display:flex;gap:6px}
.iss:hover{background:var(--ui3)}
.iss .lv{font-weight:700;min-width:52px}
.iss.error .lv{color:var(--bad)}.iss.warn .lv{color:var(--warn)}
.okmsg{color:var(--ok);font-size:13px}
.note{font-size:12px;color:var(--tx2);line-height:1.45}
.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
#paneCast{gap:0}
#castList{width:230px;border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--ui)}
.citem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.citem:hover{background:var(--ui2)}
.citem.on{background:var(--ui3);border-color:var(--line)}
.citem svg{width:38px;height:46px;flex:none}
.citem small{display:block;color:var(--tx2);font-size:11px}
#castForm{flex:1;overflow:auto;padding:14px 18px}
#castForm .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px}
#castForm .f{display:flex;flex-direction:column;gap:4px}
#castForm .f span{font-size:12px;color:var(--tx2)}
#castForm input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:#0B0D14;padding:2px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{background:var(--ui2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.chk input{margin-right:4px}
#castPrev{width:360px;border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--ui)}
#castPrevSvg{background:linear-gradient(#9FD8F5,#CDEBFA 70%,#C9C2B6 70%);border-radius:10px;width:100%;height:420px}
.scroll{overflow:auto;flex:1;padding:16px 20px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--tx2);font-weight:600}
kbd{background:var(--ui3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px}
/* script window */
#scriptApp{display:flex;flex-direction:column;height:100%}
.shead{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--ui);border-bottom:1px solid var(--line);flex-wrap:wrap}
.shead .tt{font-weight:700;color:var(--acc);letter-spacing:.5px}
.pill{background:var(--ui3);border-radius:20px;padding:3px 11px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--bad);margin-right:6px}
.dot.on{background:var(--ok)}
.smain{flex:1;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:16px}
.scnum{font-size:15px;color:var(--tx2);letter-spacing:1px}
.narr{font-size:var(--fs,34px);line-height:1.38;font-weight:600}
.turo{background:#3A3010;border:2px solid var(--acc);color:var(--acc);border-radius:10px;padding:10px 14px;font-size:calc(var(--fs,34px)*.62);font-weight:700}
.acts{font-family:Consolas,Menlo,monospace;font-size:13px;color:#8F96B5;line-height:1.5}
.nextstep{font-size:calc(var(--fs,34px)*.6);color:#8F96B5;border-left:3px solid var(--line);padding-left:12px}
.nextsc{background:var(--ui2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--tx2)}
.nextsc b{color:var(--tx)}
.sfoot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--ui);align-items:center;flex-wrap:wrap}
.sfoot .btn{font-size:15px;padding:8px 16px}
.sclist{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:var(--ui);border-top:1px solid var(--line)}
.scb{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--ui2);border:1px solid var(--line);cursor:pointer;color:var(--tx2)}
.scb.on{background:var(--acc);color:#1C1C1E;border-color:var(--acc);font-weight:700}
.scb.done{color:#6E7593}
.est-ok{color:var(--ok)}.est-low{color:var(--warn)}.est-hi{color:var(--bad)}

/* ---------- iPhone / mobile layout (nasa dulo para manalo sa naunang styles) ---------- */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
body.mobile #studio{padding-top:max(var(--sat),0px)}
body.mobile #studio .sbar{padding:max(10px,var(--sat)) 10px 8px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:2}
body.mobile #studio{padding-top:0}
body.mobile #studio .sbar .ttl,body.mobile #studio .sbar .sp{display:none}
body.mobile #studio .sbar .tab{padding:8px 10px;font-size:14px}
body.mobile #studio .sbar .btn{padding:9px 10px;font-size:13px}
body.mobile #studio .pane.on{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(16px,var(--sab))}
body.mobile #editorCol{flex:none;height:46vh;border-right:none}
body.mobile #txt{font-size:16px}
body.mobile #sideCol{flex:none;width:100%;overflow:visible}
body.mobile #castList{flex:none;width:100%;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line)}

  if (has('headset')) head += `<path d="M-33 -152 A33 33 0 0 1 33 -152" stroke="#2B2B2E" stroke-width="5" fill="none"/><rect x="-38" y="-162" width="10" height="20" rx="4" fill="#2B2B2E"/><rect x="28" y="-162" width="10" height="20" rx="4" fill="#2B2B2E"/><path d="M33 -144 Q30 -128 ${10 + f} -130" stroke="#2B2B2E" stroke-width="3" fill="none"/><circle cx="${9 + f}" cy="-130" r="3.5" fill="#2B2B2E"/>`;
  const heldSVG = (name, s, e, side) => {

    if (PROPS[name]) return `<g transform="translate(0,${name === 'phone' ? 30 : 44}) rotate(${-(s + e)}) scale(.34)">${PROPS[name]()}</g>`;

      `<rect x="-6.5" y="-6" width="13" height="31" rx="6.5" fill="${c.shirt}" stroke="${shirtStroke}" stroke-width="1"/>` +
      `<g transform="translate(0,22)"><g class="elA"><g transform="rotate(${e})">` +

      (long ? `<rect x="-5.2" y="20" width="10.4" height="6" rx="2" fill="${darken(c.shirt, .1)}"/>` : '') +
      `${thumb}<circle cx="0" cy="31" r="6.6" fill="${c.skin}" stroke="${OL}" stroke-width=".9"/>${hold}</g></g></g></g></g></g>`;
  };
  const fr = actv && actv.front ? FRONT[actv.front] : null;
  const frSVG = fr ? (fr.prop ? `<g transform="${fr.tf}">${PROPS[fr.prop]()}</g>` : fr.svg) : '';
  const headG = piv(0, -126, 'headA', head);
  let out = `<g class="legs">${legs}</g>` +
    `<g transform="translate(0,${dy})"><g class="torsoA"><g class="upper">${body}${neck}${headG}</g>${fr && !fr.ground ? frSVG : ''}</g></g>` +
    (fr && fr.ground ? frSVG : '') +
    `<g transform="translate(0,${dy})"><g class="torsoA"><g class="upper">${arm(-1)}${arm(1)}</g></g></g>`;
  if (stance === 'hide') out += coverSVG(st.cover);
  if (actv && actv.zzz) out += `<g transform="translate(0,${dy})" class="pulse">${markSVG('zzz')}</g>`;
  if (stance === 'lie') out = `<g transform="translate(100,-34) rotate(-90)">${out}</g>`;
  return out;
}

function toast(msg, ms = 3200) {
  const t = $('#toast'); if (!t) return; if (typeof Stage !== 'undefined' && Stage.record) return;
  const d = document.createElement('div'); d.innerHTML = msg; t.appendChild(d);
  setTimeout(() => { d.style.transition = 'opacity .4s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 450); }, ms);
}

/* ========== sync ========== */
const Sync = {
  id: Math.random().toString(36).slice(2), seq: 0, seen: {}, bc: null, peer: null, handlers: [],
  init() {
    try { this.bc = new BroadcastChannel('classystories_v1'); this.bc.onmessage = e => this.recv(e.data); } catch (e) {}
    addEventListener('message', e => { if (e.data && e.data.__cs) this.recv(e.data); });
    addEventListener('storage', e => { if (e.key === 'cs_sync' && e.newValue) { try { this.recv(JSON.parse(e.newValue)); } catch (_) {} } });
    try { if (window.opener) this.peer = window.opener; } catch (e) {}
  },
  send(m) {
    m = Object.assign({}, m, { __cs: 1, from: this.id, seq: ++this.seq });
    try { this.bc && this.bc.postMessage(m); } catch (e) {}
    try { if (this.peer && !this.peer.closed) this.peer.postMessage(m, '*'); } catch (e) {}
    try { localStorage.setItem('cs_sync', JSON.stringify(m)); } catch (e) {}
  },
  recv(m) { if (!m || m.from === this.id) return; const k = m.from + ':' + m.seq; if (this.seen[k]) return; this.seen[k] = 1; this.handlers.forEach(h => h(m)); },
  on(h) { this.handlers.push(h); }
};

    const n = Math.max(1, parseInt($('#cStep').value, 10) || 1);
    const q = s => '"' + s.replace(/"/g, "'") + '"';
    let body = '';
    if (who === '@global') {
      if (a === 'title' || a === 'caption') body = `${a} ${q(v('aText') || '...')}`;
      else if (a === 'prop') body = `prop ${v('aProp')} at:${v('aSlot')}${v('aY') !== 'air' ? ' y:' + v('aY') : ''}${v('aSize') !== 'm' ? ' size:' + v('aSize') : ''}`;
      else if (a === 'prop-hide') body = `prop ${v('aProp')} hide`;
      else if (a === 'camera-zoom') body = `camera zoom ${v('aTarget')} ${v('aZoom') || 1.4}`;
      else if (a === 'fx') body = `fx ${v('aProp')}`;
      else if (a === 'pass') body = `pass ${v('aProp')} ${v('aDir')}`;
      else if (a === 'camera-closeup') body = `camera closeup ${v('aTarget')}`;
      else if (a === 'camera-pan') body = `camera pan ${v('aDir')}`;
      else if (a === 'camera-low') body = 'camera low';
      else if (a === 'camera-reset') body = 'camera reset';
      else if (a === 'camera-shake') body = 'camera shake';
      else if (a === 'clear') body = `clear ${v('aWhat')}`;
      else body = a;
    } else {
      if (a.startsWith('recipe:')) body = `@${a.slice(7)} ${who}`;
      else if (a.startsWith('expr:')) body = `${who} ${a.slice(5)}`;
      else if (['walkin', 'show', 'moveto'].includes(a)) body = `${who} ${a === 'walkin' ? 'walkIn' : a === 'moveto' ? 'moveTo' : a}${v('aSlot') ? ' ' + v('aSlot') : ''}`;
      else if (['walkout', 'turn', 'point'].includes(a)) body = `${who} ${a === 'walkout' ? 'walkOut' : a}${v('aDir') ? ' ' + v('aDir') : ''}`;
      else if (a === 'hold') body = `${who} hold ${v('aProp')}`;
      else if (a === 'mark') body = `${who} mark ${v('aMark')}`;
      else if (a === 'face') body = `${who} face${v('aEyes') ? ' eyes:' + v('aEyes') : ''}${v('aBrows') ? ' brows:' + v('aBrows') : ''}${v('aMouth') ? ' mouth:' + v('aMouth') : ''}`;
      else if (['say', 'shout'].includes(a)) body = `${who} ${a} ${q(v('aText') || '...')}`;
      else if (a === 'think') body = `${who} think${v('aText') ? ' ' + q(v('aText')) : ''}`;
      else if (ACTIONS[a] && ['slot', 'run'].includes(ACTIONS[a].t)) body = `${who} ${a} ${v('aSlot')}`;
      else if (ACTIONS[a] && ACTIONS[a].t === 'actor') body = `${who} ${a} ${v('aTarget')}`;
      else if (ACTIONS[a] && ACTIONS[a].t === 'cover') body = `${who} cover ${v('aCover')}`;
      else if (ACTIONS[a] && ACTIONS[a].t === 'prop') body = `${who} ${a} ${v('aProp')}`;
      else body = `${who} ${a}`;
    }
    let out = `[${n}] ${body}`;
    if (v('cNarr')) out += `\n> ${v('cNarr')}`;
    return out;

const Script = {
  story: null, pos: { s: -1, k: 0 }, t0: 0, retakes: [], last: 0, fs: LS.get('cs_fs', 34),
  build() {
    document.title = 'Script — ClassyStories';

    $('#app').innerHTML = `<div id="scriptApp">
      <div class="shead"><span class="tt" id="sTitle">ClassyStories</span><span class="pill"><span class="dot" id="sDot"></span><span id="sConn">Hinahanap ang Stage…</span></span><span class="pill">⏱ <b id="sTime">0:00</b></span><span class="pill">Est <b id="sEst">0:00</b></span><span class="pill">⚑ <b id="sRt">0</b></span><span class="sp" style="flex:1"></span><button class="btn" id="fsM">A−</button><button class="btn" id="fsP">A+</button></div>
      <div class="smain" id="sMain"></div>
      <div class="sclist" id="sList"></div>
      <div class="sfoot"><button class="btn" id="sPrev">◀ Back</button><button class="btn pri" id="sNext">Next ▶</button><button class="btn" id="sRep">⟲ Replay</button><button class="btn" id="sMark">⚑ Retake (M)</button><span class="sp" style="flex:1"></span><span class="note">Space/→ next · ← back · M retake — kahit dito naka-focus, susunod ang Stage.</span></div></div>`;
    document.documentElement.style.setProperty('--fs', this.fs + 'px');
    $('#fsM').onclick = () => this.font(-3); $('#fsP').onclick = () => this.font(3);
    $('#sPrev').onclick = () => this.cmd('prev'); $('#sNext').onclick = () => this.cmd('next'); $('#sRep').onclick = () => this.cmd('replay'); $('#sMark').onclick = () => this.cmd('mark');

      if (e.target.tagName === 'INPUT') return;
      const k = e.key;
      if ([' ', 'ArrowRight', 'PageDown', 'ArrowDown'].includes(k)) { e.preventDefault(); this.cmd('next'); }
      else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(k)) { e.preventDefault(); this.cmd('prev'); }
      else if (k === 'r' || k === 'R') this.cmd('replay');
      else if (k === 'm' || k === 'M') this.cmd('mark');
      else if (k === 'Enter') this.cmd('enter');
      else if (k === 'b' || k === 'B' || k === '.') this.cmd('black');
    });
    Sync.on(m => this.onMsg(m));
    const local = LS.get('cs_story_text', null) || getEmbeddedStory();
    this.setStory(local);
    const hello = () => { if (Date.now() - this.last > 4000) Sync.send({ t: 'hello' }); };

  font(d) { this.fs = clamp(this.fs + d, 18, 72); LS.set('cs_fs', this.fs); document.documentElement.style.setProperty('--fs', this.fs + 'px'); },
  cmd(c, extra) { Sync.send(Object.assign({ t: 'cmd', c }, extra || {})); },
  onMsg(m) {
    this.last = Date.now();
    if (m.t === 'story') this.setStory(m.text);
    if (m.t === 'pos') { this.pos = { s: m.s, k: m.k }; this.t0 = m.t0; this.retakes = m.retakes || []; this.render(); }
    if (m.t === 'cast') { loadCast(); }
  },
  setStory(text) { if (!text) return; this.story = parseStory(text); this.render(); },

      await this.wait(Math.max(1400, w[w.length - 1] / 14 * 1000));
    }
  },
  renderBtn() { const b = $('#vPlay'); if (b) b.textContent = this.playing ? '■ Stop' : '▶ Auto-play mula simula'; },
  /* ---- UI ---- */
  async render() {
    const c = this.cfg, box = $('#voiceBody'); if (!box || !Stage.story) return;
    const scs = Stage.story.scenes, chars = this.stepItems().reduce((a, it) => a + it.text.length, 0);
    box.innerHTML = `
<div class="row" style="margin-bottom:10px"><h3 style="margin:0;flex:1">Voice / Auto-play — ${esc(Stage.story.meta.title)}</h3><button class="btn pri" id="vPlay">▶ Auto-play mula simula</button></div>
<div class="row"><label style="min-width:auto"><input type="radio" name="vm" value="semi" ${c.mode === 'semi' ? 'checked' : ''}> <b>Semi-auto</b> — ikaw ang magda-download ng MP3 kada scene</label>
<label style="min-width:auto;margin-left:18px"><input type="radio" name="vm" value="full" ${c.mode === 'full' ? 'checked' : ''}> <b>Full-auto</b> — ElevenLabs API, isang pindot</label></div>
<p class="note">Habang naka-auto-play: <kbd>A</kbd> = stop/start. ${IS_MOBILE ? 'Sa iPhone: simulan ang Screen Recording, tapos pindutin ang 🎬 Record sa ibaba.' : 'Simulan muna ang OBS recording (kasama ang desktop audio), tapos pindutin ang Auto-play.'} ~${chars.toLocaleString()} characters ang buong narration.</p>
<div class="card" style="margin:10px 0"><h4>Bigkas (pronunciation fixes — ginagamit sa parehong mode)</h4><textarea class="in mono" id="vDict" style="width:100%;height:110px">${esc(c.dict)}</textarea><div class="note">Isang palit kada linya: <span class="mono">mali = tama</span>. Hal. <span class="mono">mag-OT = mag-O-T</span>. Hindi binabago ang nakasulat sa screen, sa boses lang.</div></div>
<div id="vMode"></div>`;
    $$('input[name=vm]').forEach(r => r.onchange = () => { c.mode = r.value; this.save(); this.render(); });
    $('#vDict').oninput = e => { c.dict = e.target.value; this.save(); };
    $('#vPlay').onclick = () => this.toggle(); this.renderBtn();
    const m = $('#vMode');
    if (c.mode === 'semi') {
      m.innerHTML = `<div class="card"><h4>Semi-auto (pinaka-natural): isang MP3 para sa buong story</h4>
<ol class="note" style="margin:4px 0 10px 18px;line-height:1.6"><li>Pindutin ang <b>Copy buong script</b> → i-paste sa ElevenLabs Text to Speech gamit ang voice clone mo → Generate.</li><li>I-download, pangalanan na <span class="mono">full.mp3</span>, tapos <b>Pumili ng MP3s</b>.</li></ol>
<div class="row"><button class="btn pri" id="vCopyFull">Copy buong script</button><span class="note" id="vFullSt"></span></div></div>
<div class="card" style="margin-top:10px"><h4>O kaya: 1 MP3 kada scene</h4>
<ol class="note" style="margin:4px 0 10px 18px;line-height:1.6"><li>I-copy ang text ng scene → i-paste sa ElevenLabs (web o phone app) gamit ang cloned voice mo.</li><li>I-download at pangalanan ayon sa <b>File</b> column (hal. <span class="mono">01.mp3</span>).</li><li>${IS_MOBILE ? 'Pindutin ang <b>Pumili ng MP3s</b> at piliin ang mga file mula sa Files app (naka-save na sila sa phone pagkatapos).' : `Ilagay sa folder na <span class="mono">${esc(c.folder)}\\</span> sa tabi ng story file. O gamitin ang <b>Pumili ng MP3s</b>.`}</li></ol>
<div class="row"><label>Folder</label><input class="in" id="vFolder" value="${esc(c.folder)}" style="width:120px"><button class="btn" id="vCopyAll">Copy lahat (may header kada scene)</button><button class="btn" id="vPick">Pumili ng MP3s…</button><input type="file" id="vFiles" accept="audio/*" multiple style="display:none"><button class="btn" id="vCheck">Check files</button></div>
<table class="t" style="margin-top:8px"><tr><th>#</th><th>File</th><th>Narration (malinis na para sa ElevenLabs)</th><th></th><th>Status</th></tr>
${scs.map((sc, i) => `<tr><td>${i + 1}</td><td class="mono">${this.fname(i)}</td><td style="max-width:560px">${esc(this.sceneText(sc) || '— walang narration —')}</td><td><button class="btn" data-copy="${i}">Copy</button></td><td id="vSt${i}" class="note">—</td></tr>`).join('')}</table></div>`;
      $('#vFolder').oninput = e => { c.folder = e.target.value.trim() || 'vo'; this.save(); };
      $$('[data-copy]').forEach(b => b.onclick = () => { const t = this.sceneText(scs[+b.dataset.copy]); navigator.clipboard && navigator.clipboard.writeText(t); toast(`Nakopya ang Scene ${+b.dataset.copy + 1}.`); });
      $('#vCopyAll').onclick = () => { const t = scs.map((sc, i) => `[${this.fname(i)}]\n${this.sceneText(sc)}`).join('\n\n'); navigator.clipboard && navigator.clipboard.writeText(t); toast('Nakopya lahat.'); };
      $('#vPick').onclick = () => $('#vFiles').click();
      $('#vFiles').onchange = async e => { const fs = Array.from(e.target.files); for (const f of fs) { const n = f.name.toLowerCase(); this.picked[n] = URL.createObjectURL(f); await this.putClip('semi:' + Stage.key + ':' + n, f); } toast(`${fs.length} file ang na-save para sa story na ito.`); this.check(); };
      $('#vCopyFull').onclick = () => { const t = this.script().chunks.map(ch => ch.text).join('\n\n'); navigator.clipboard && navigator.clipboard.writeText(t); toast('Nakopya ang buong script.'); };
      $('#vCheck').onclick = () => this.check(); this.check();
    } else {
      const items = this.stepItems(); const stt = await this.storyStatus();
      m.innerHTML = `<div class="card"><h4>Full-auto: ElevenLabs API</h4>
<div class="row"><label>API key</label><input class="in" id="vKey" type="password" value="${esc(c.key)}" style="flex:1" placeholder="sk_..."></div>
<div class="row"><label>Voice ID</label><input class="in" id="vVoice" value="${esc(c.voiceId)}" style="flex:1" placeholder="Galing sa ElevenLabs → Voices → (cloned voice mo) → Copy ID"></div>
<div class="row"><label>Model</label><select class="in" id="vModel">${['eleven_multilingual_v2', 'eleven_v3', 'eleven_flash_v2_5', 'eleven_turbo_v2_5'].map(x => `<option ${x === c.model ? 'selected' : ''}>${x}</option>`).join('')}</select><span class="note">multilingual_v2 = pinaka-stable sa Taglish</span></div>
<div class="row"><label>Stability</label><input class="in" id="vStab" type="number" step=".05" min="0" max="1" value="${c.stability}" style="width:70px"><label>Similarity</label><input class="in" id="vSim" type="number" step=".05" min="0" max="1" value="${c.similarity}" style="width:70px"><label>Style</label><input class="in" id="vSty" type="number" step=".05" min="0" max="1" value="${c.style}" style="width:70px"><label>Speed</label><input class="in" id="vSpd" type="number" step=".05" min=".7" max="1.2" value="${c.speed}" style="width:70px"></div>
<div class="row"><label style="min-width:auto"><input type="checkbox" id="vTight" ${c.tight === false ? '' : 'checked'}> <b>Walang dead air</b> — nilalaktawan ang katahimikang lagpas ~0.3s (walang dagdag na credits)</label></div>
<div class="row" style="margin-top:8px"><button class="btn pri" id="vGen">Generate lahat</button><button class="btn" id="vTest">Test ang unang linya</button><button class="btn" id="vDl">Download MP3 (backup)</button><span id="vProg" class="note">${stt.ok === stt.total && stt.total ? '<span style="color:var(--ok)">✓ Handa ang boses ng buong story</span>' : 'Wala pang boses — pindutin ang Generate lahat'} · ~${stt.chars.toLocaleString()} characters</span></div>
<p class="note">Ginagawa ang buong narration bilang <b>isang tuloy-tuloy na boses</b>, kasama ang eksaktong oras ng bawat salita. Ang animation ang sumusunod sa boses, kaya natural ang daloy. Naka-save ito sa app: hindi na gagastos ulit hangga't hindi binabago ang narration o voice settings. (Kapag may binago kahit isang linya, buong story ang gagawin ulit.) Kailangan ng internet habang nagge-generate lang.<br><b>Babala:</b> naka-save ang API key sa browser na ito. Huwag ibahagi ang story file habang bukas ang Studio, at gumamit ng API key na may limit sa ElevenLabs.</p></div>`;
      const bind = (id, k, num) => { $(id).oninput = e => { c[k] = num ? +e.target.value : e.target.value.trim(); this.save(); }; };
      bind('#vKey', 'key'); bind('#vVoice', 'voiceId'); bind('#vStab', 'stability', 1); bind('#vSim', 'similarity', 1); bind('#vSty', 'style', 1); bind('#vSpd', 'speed', 1);
      $('#vModel').onchange = e => { c.model = e.target.value; this.save(); };
      $('#vTight').onchange = e => { c.tight = e.target.checked; this.save(); };
      $('#vGen').onclick = () => this.generateAll();
      $('#vDl').onclick = () => this.downloadAll();
      $('#vTest').onclick = async () => { const it = items[0]; if (!it) return; if (!c.key || !c.voiceId) { toast('Ilagay muna ang API key at Voice ID.'); return; } try { $('#vProg').textContent = 'Tine-test…'; let b = await this.getClip(it.key); if (!b) { b = await this.tts(it.text); await this.putClip(it.key, b); } const u = URL.createObjectURL(b); new Audio(u).play(); $('#vProg').textContent = 'Nagpe-play ang test.'; } catch (e) { toast(esc(e.message), 9000); $('#vProg').textContent = 'Error.'; } };
    }
  },
  async check() { await this.loadPicked(); const fsd = await this.probe(this.picked['full.mp3'] || `${this.cfg.folder.replace(/\/+$/, '')}/full.mp3`); const fe = $('#vFullSt'); if (fe) fe.innerHTML = fsd ? `<span style="color:var(--ok)">✓ full.mp3 (${fmtTime(fsd)}) — ito ang gagamitin</span>` : 'wala pang full.mp3'; const scs = Stage.story.scenes; for (let i = 0; i < scs.length; i++) { const d = await this.probe(this.srcFor(i)); const el = $('#vSt' + i); if (el) { el.innerHTML = d ? `<span style="color:var(--ok)">✓ ${d.toFixed(1)}s</span>` : `<span style="color:var(--warn)">wala</span>`; } } }
};

/* ========== boot ========== */
function getEmbeddedStory() { const el = $('#cs-story'); return el ? el.textContent.replace(/<\\\/script/gi, '</script').trim() : ''; }
function setupMobile() {
  document.body.classList.add('mobile');
  Stage.laser = false; Stage.guide = false;
  $('#guideL').style.display = 'none';
  const svg = $('#stage'); svg.setAttribute('viewBox', `${SAFE_L} 0 ${SAFE_R - SAFE_L} ${H}`); svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  document.body.style.background = '#000';
  const act = m => {
    if (m === 'next') { if (Voice.playing) Voice.stop(); Stage.next(); }
    else if (m === 'prev') { if (Voice.playing) Voice.stop(); Stage.prev(); }
    else if (m === 'auto') Voice.toggle();
    else if (m === 'studio') { if (Voice.playing) Voice.stop(); Studio.toggle(true); Studio.setTab('story'); }
    else if (m === 'rec') {
      Voice.unlock();
      toast('Simulan ang iOS Screen Recording kung hindi pa. Magsisimula sa loob ng 3 segundo…', 2800);
      setTimeout(() => { Stage.record = true; document.body.classList.add('record'); Voice.start(); }, 3000);
    }
  };
  $('#mbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.m); });
  // tap stage: kanan = next, kaliwa = back; long-press = ibalik ang controls
  let pressT = null, longFired = false, sx = 0, sy = 0;
  const wrap = $('#stageWrap');
  wrap.addEventListener('touchstart', e => { longFired = false; const t = e.touches[0]; sx = t.clientX; sy = t.clientY; pressT = setTimeout(() => { longFired = true; if (Stage.record) { Stage.record = false; document.body.classList.remove('record'); if (Voice.playing) Voice.stop(); toast('Lumabas sa record mode.', 1500); } }, 650); }, { passive: true });
  wrap.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) clearTimeout(pressT); }, { passive: true });
  wrap.addEventListener('touchend', e => {
    clearTimeout(pressT); if (longFired) return;
    if (Stage.record) { const h = $('#holdHint'); h.style.display = 'block'; setTimeout(() => h.style.display = 'none', 1400); return; }
    if (Voice.playing) return;
    if (sx > innerWidth / 3) Stage.next(); else Stage.prev();
  });
  wrap.addEventListener('contextmenu', e => e.preventDefault());
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
function bootStage() {
  Stage.build(); Studio.build();
  const kind = ($('#cs-story') || {}).dataset ? $('#cs-story').dataset.kind : 'template';
  Stage.kind = kind || 'template';
  const text = Stage.kind === 'template' ? (LS.get('cs_story_text', null) || getEmbeddedStory()) : getEmbeddedStory();
  $('#txt').value = Stage.kind === 'template' ? (LS.get('cs_draft', null) || text) : text;
  Stage.load(text);
  if (IS_MOBILE) setupMobile(); else document.body.classList.add('laser');
  const laser = $('#laser');
  addEventListener('mousemove', e => { laser.style.left = e.clientX + 'px'; laser.style.top = e.clientY + 'px'; laser.classList.add('on'); });
  document.addEventListener('mouseleave', () => laser.classList.remove('on'));
  addEventListener('mousedown', () => laser.classList.add('down')); addEventListener('mouseup', () => laser.classList.remove('down'));
  $('#hud').addEventListener('click', e => { const k = e.target.dataset && e.target.dataset.k; if (k) handleKey(k, e); });
  addEventListener('keydown', e => {
    if (Studio.open) { if (e.key === 'Escape') Studio.toggle(false); return; }
    handleKey(e.key, e);
  });
  addEventListener('resize', () => Studio.open && Studio.tab === 'help' && Studio.renderHelp());
  Sync.on(m => {
    if (m.t === 'hello') { Sync.send({ t: 'story', text: Stage.text }); Stage.broadcast(); }
    if (m.t === 'cmd') {
      const c = m.c;
      if (c === 'next') Stage.next(); else if (c === 'prev') Stage.prev(); else if (c === 'replay') Stage.render(); else if (c === 'mark') Stage.markRetake();
      else if (c === 'goto') { if (!Stage.t0) Stage.t0 = Date.now(); Stage.go({ s: m.s, k: 0 }); }
      else if (c === 'enter') handleKey('Enter', { preventDefault() {} });
      else if (c === 'black') handleKey('b', { preventDefault() {} });
    }
  });
  setInterval(() => Stage.broadcast(), 3000);
  if (location.protocol === 'file:') {}
}
function handleKey(k, e) {
  const S = Stage;
  switch (k) {
    case ' ': case 'ArrowRight': case 'PageDown': case 'ArrowDown': e.preventDefault && e.preventDefault(); if (Voice.playing) { Voice.stop('Auto-play huminto (manual na pindot).'); break; } S.next(); break;
    case 'ArrowLeft': case 'PageUp': case 'ArrowUp': case 'Backspace': e.preventDefault && e.preventDefault(); S.prev(); break;
    case 'Enter': if (S.pos.s < 0) { const sv = LS.get('cs_pos_' + S.key, null); if (sv && sv.s >= 0) { S.t0 = Date.now(); S.go({ s: sv.s, k: 0 }); toast(`Itinuloy sa Scene ${sv.s + 1}.`); } else S.next(); } else S.next(); break;
    case 'r': case 'R': S.render(); break;
    case 'f': case 'F': if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); break;
    case 'h': case 'H': S.record = !S.record; document.body.classList.toggle('record', S.record); $('#guideLine').style.display = S.record || !S.guide ? 'none' : ''; toast(S.record ? 'Record mode ON — nakatago ang UI. H para ibalik.' : 'Record mode OFF', 1800); break;
    case 'g': case 'G': S.guide = !S.guide; $('#guideL').style.display = S.guide ? '' : 'none'; $('#guideLine').style.display = S.record || !S.guide ? 'none' : ''; break;
    case 'l': case 'L': S.laser = !S.laser; document.body.classList.toggle('laser', S.laser); toast('Laser ' + (S.laser ? 'ON' : 'OFF'), 1200); break;
    case 'm': case 'M': S.markRetake(); break;
    case 's': case 'S': openScript(); break;
    case 'e': case 'E': Studio.toggle(true); Studio.setTab('story'); break;
    case 'c': case 'C': Studio.toggle(true); Studio.setTab('cast'); break;
    case '?': case '/': Studio.toggle(true); Studio.setTab('help'); break;
    case 'n': case 'N': if (S.story) { if (!S.t0) S.t0 = Date.now(); S.go({ s: Math.min(S.pos.s + 1, S.story.scenes.length), k: 0 }); } break;
    case 'p': case 'P': if (S.story) S.go({ s: Math.max(S.pos.s - 1, -1), k: 0 }); break;
    case 'Home': S.go({ s: -1, k: 0 }); break;
    case 'End': if (S.story) S.go({ s: S.story.scenes.length, k: 0 }); break;
    case 'a': case 'A': Voice.toggle(); break;
    case 'b': case 'B': case '.': S.black = !S.black; $('#blackL').setAttribute('opacity', S.black ? 1 : 0); break;
  }
}
let scriptWin = null;
function openScript() {
  const url = location.href.split('#')[0] + '#script';
  scriptWin = window.open(url, 'cs_script', 'popup,width=980,height=1000');
  if (!scriptWin) { toast('Na-block ang popup. Payagan ang popups para sa file na ito, o buksan ang file nang manual at idagdag ang <b>#script</b> sa dulo ng address.', 7000); return; }
  Sync.peer = scriptWin;
  setTimeout(() => { Sync.send({ t: 'story', text: Stage.text }); Stage.broadcast(); }, 700);
  toast('Script window binuksan — ilipat sa kaliwang monitor.');
}

loadCast();
Sync.init();
if (IS_SCRIPT) Script.build(); else bootStage();
</script>
